# ساخت اپ iOS روی GitHub Actions.
#
# چرا اینجا: ساخت iOS فقط روی macOS با Xcode ممکن است — این محدودیت اپل است،
# نه انتخاب ما. گیت‌هاب runner مک می‌دهد، پس بدون داشتن مک هم می‌شود ساخت.
#
# خروجی: یک فایل IPA «بدون امضا».
#   • با اپل‌آیدی خودت و ابزارهایی مثل Sideloadly یا AltStore روی گوشی نصب
#     می‌شود (اعتبار ۷ روزه‌ی حساب رایگان).
#   • برای انتشار در App Store یا TestFlight باید امضا شود، که به حساب
#     Apple Developer و گواهی نیاز دارد. آن گواهی و رمزش باید به‌عنوان
#     GitHub Secret ثبت شوند، بعد مرحله‌ی export با پروفایل واقعی اضافه شود.
#
# چرا archive برای iphoneos و نه build برای شبیه‌ساز: باینری واقعی arm64
# ساخته می‌شود، هم قابل نصب است و هم بررسی سخت‌گیرانه‌تری از کامپایل.

name: ساخت اپ iOS

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: نصب وابستگی‌ها
        run: npm ci

      - name: build وب برای بسته‌ی نیتیو
        run: npm run build:mobile

      - name: همگام‌سازی با پروژه‌ی iOS
        run: npx cap sync ios

      - name: Archive بدون امضا
        working-directory: frontend/ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/App.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            archive

      # IPA در واقع یک zip است با پوشه‌ی Payload در ریشه. چون امضا نداریم
      # نمی‌شود از -exportArchive استفاده کرد (پروفایل می‌خواهد)، پس دستی
      # بسته‌بندی می‌کنیم — همان ساختاری که نصب‌کننده‌ها انتظار دارند.
      - name: بسته‌بندی به IPA
        working-directory: frontend/ios/App
        run: |
          APP=$(find build/App.xcarchive/Products/Applications -maxdepth 1 -name '*.app' | head -1)
          if [ -z "$APP" ]; then echo "هیچ .app ای در archive نیست"; exit 1; fi
          echo "پیدا شد: $APP"
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          cd build && zip -qry mafia-unsigned.ipa Payload
          ls -lh mafia-unsigned.ipa

      - uses: actions/upload-artifact@v5
        with:
          name: mafia-ipa-unsigned
          path: frontend/ios/App/build/mafia-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
